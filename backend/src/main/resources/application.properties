# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=SGI Procurement Backend

# Logging
logging.level.root=INFO
logging.level.com.sgiprocurement=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sgi_procurement}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
jwt.secret=sgi-procurement-secret-key-2024-spring-boot-jwt-authentication-for-hs512-signing-key
jwt.expiration=86400000

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin@123

# CORS Configuration
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# File upload (minh chứng DNTT)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
# Đường dẫn tuyệt đối — tránh Tomcat ghi vào thư mục work tạm
app.upload.dir=${user.home}/.sgi-procurement/uploads

# Cost Variance Alert Configuration
cost.variance.alert.threshold.percentage=20
