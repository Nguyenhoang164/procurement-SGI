# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=SGI Procurement Backend

# Logging
logging.level.root=INFO
logging.level.com.sgiprocurement=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Database Configuration - H2 (Development)
spring.datasource.url=jdbc:h2:mem:sgi_procurementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MySQL Configuration (Uncomment when using MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/sgi_procurement
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
jwt.secret=sgi-procurement-secret-key-2024-spring-boot-jwt-authentication
jwt.expiration=86400000

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin@123

# CORS Configuration
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
